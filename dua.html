    <style>
        .highlight-dua {
            border: 2px solid #0d6efd !important;
            box-shadow: 0 0 15px rgba(13, 110, 253, 0.5);
            transition: 0.3s ease;
        }

        /* ===== CUSTOM GOLD TABS ===== */

        .custom-tabs {
            position: relative;
            display: inline-flex;
            background: #b8a65a;
            border-radius: 50px;
            padding: 6px;
            border: 3px solid #2f2f2f;
            overflow: hidden;
        }

        .custom-tabs .tab-btn {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            padding: 8px 28px;
            font-weight: 600;
            font-size: 14px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .custom-tabs .tab-btn.active {
            color: #2f2f2f;
        }

        .custom-tabs .tab-indicator {
            position: absolute;
            top: 5px;
            left: 5px;
            height: calc(100% - 10px);
            width: 0;
            background: #f3ead2;
            border-radius: 40px;
            transition: 0.3s ease;
            z-index: 1;
        }

        .dua-parent-container {
            height: 48vh;
            overflow-x: hidden;
            overflow-y: scroll;
            padding-top: 20px;
        }


        /* Mobile Responsive */
        @media (max-width: 576px) {
            .custom-tabs .tab-btn {
                padding: 6px 16px;
                font-size: 12px;
            }

            .dua-parent-container {
                OVERFLOW: scroll;
                HEIGHT: 100VH;
                height: 30vh;
                /* padding: 30px 20px; */
                margin: 30px 0px;
            }

        }



        /* ===== NIGHT MODE ===== */
        body.night-mode {
            background: #0f1c2e;
            color: #f5f5f5;
        }

        body.night-mode .dua-card {
            background: #16263d;
            color: #ffffff;
        }

        body.night-mode .card-header {
            background: #1d3354;
        }

        body.night-mode .custom-tabs {
            background: #8c7a3a;
        }

        body.night-mode .tab-indicator {
            background: #ffffff;
        }
    </style>
</head>

            /* =========================
               NIGHT MODE LOGIC
            ========================== */

            function autoNightMode() {

                const now = new Date();
                const hour = now.getHours();

                // Simple logic:
                // Night = 6 PM (18) to 5 AM
                if (hour >= 18 || hour < 5) {
                    document.body.classList.add("night-mode");
                } else {
                    document.body.classList.remove("night-mode");
                }
            }

            /* Run on load */
            autoNightMode();

            /* Check every minute */
            setInterval(autoNightMode, 60000);

                    col.className = "col-lg-6 col-md-6 mb-4";

                    col.innerHTML = `
                <div class="card dua-card h-100" data-index="${index}">
                    <div class="card-header">
                        <h5 class="card-title text-center">
                            ${dua.title[currentLang]}
                        </h5>
                    </div>
                    <div class="card-body">
                        <p class="text-center fw-bold">
                            ${dua.text[currentLang]}
                        </p>
                        <hr>
                        <p class="text-center">
                            ${currentLang === "en" ? dua.translation.en : dua.translation.ur}
                        </p>
                    </div>
                </div>
            `;

                    container.appendChild(col);
                });
            }

            /* =========================
               FILTER
            ========================== */
            function filterAndRender() {

                let filtered = duas;

                if (activeCategory !== "all") {
                    filtered = duas.filter(d => d.category === activeCategory);
                }

                renderDuas(filtered);
            }

            /* =========================
               TAB INDICATOR
            ========================== */
            function moveIndicator(element) {
                if (!indicator) return;
                indicator.style.width = element.offsetWidth + "px";
                indicator.style.left = element.offsetLeft + "px";
            }

            tabs.forEach(tab => {

                tab.addEventListener("click", function () {

                    tabs.forEach(t => t.classList.remove("active"));
                    this.classList.add("active");

                    activeCategory = this.dataset.category;

                    moveIndicator(this);
                    filterAndRender();
                });

            });

            window.addEventListener("load", function () {
                const activeTab = document.querySelector(".tab-btn.active");
                if (activeTab) moveIndicator(activeTab);
            });

            /* =========================
               LANGUAGE TOGGLE
            ========================== */
            toggle.addEventListener("change", function () {

                currentLang = this.checked ? "ar" : "en";
                switcher.classList.toggle("active", this.checked);

                filterAndRender();
            });

            /* =========================
               SEARCH
            ========================== */
            function performSearch() {

                const value = searchInput.value.toLowerCase().trim();
                searchResults.innerHTML = "";

                if (!value) {
                    searchResults.style.display = "none";
                    return;
                }

                const filtered = duas
                    .map((dua, index) => ({ ...dua, index }))
                    .filter(dua =>
                        dua.title.en.toLowerCase().includes(value) ||
                        dua.title.ar.toLowerCase().includes(value)
                    );

                if (filtered.length === 0) {
                    searchResults.style.display = "none";
                    return;
                }

                filtered.forEach(dua => {

                    const item = document.createElement("a");
                    item.href = "javascript:void(0)";
                    item.className = "list-group-item list-group-item-action";
                    item.innerText = dua.title.en;

                    item.addEventListener("click", function () {

                        activeCategory = "all";
                        tabs.forEach(t => t.classList.remove("active"));
                        document.querySelector('[data-category="all"]').classList.add("active");
                        moveIndicator(document.querySelector('[data-category="all"]'));

                        filterAndRender();

                        setTimeout(() => {

                            const cards = document.querySelectorAll(".dua-card");
                            const card = cards[dua.index];

                            if (!card) return;

                            card.scrollIntoView({
                                behavior: "smooth",
                                block: "center"
                            });

                            cards.forEach(c => c.classList.remove("highlight-dua"));
                            card.classList.add("highlight-dua");

                        }, 150);

                        searchResults.style.display = "none";
                        searchInput.value = "";
                    });

                    searchResults.appendChild(item);
                });

                searchResults.style.display = "block";
            }

            searchInput.addEventListener("input", performSearch);

            document.addEventListener("click", function (e) {
                if (!e.target.closest(".input-group")) {
                    searchResults.style.display = "none";
                }
            });

            /* =========================
               INITIAL LOAD
            ========================== */
            filterAndRender();

        });
    </script>


</body>

</html>
