    <!-- FullCalendar JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.15/index.global.min.js"
        integrity="sha512-PneTXNl1XRcU6n5B1PGTDe3rBXY04Ht+Eddn/NESwvyc+uV903kiyuXCWgL/OfSUgnr8HLSGqotxe6L8/fOvwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Moment.js & Moment Hijri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Get the current page URL
            let currentPage = window.location.pathname.split("/").pop();

            // Get all menu links
            let menuLinks = document.querySelectorAll(".nav-menu-link a");

            menuLinks.forEach(link => {
                let linkHref = link.getAttribute("href");

                if (currentPage === linkHref) {
                    link.parentElement.classList.add("nav-active");
                }
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Prevent translation by dynamically adding a meta tag
            var metaTag = document.createElement('meta');
            metaTag.name = "google";
            metaTag.content = "notranslate";
            document.head.appendChild(metaTag);

            // Prevent translation for the calendar element
            var calendarEl = document.getElementById('calendar');
            if (calendarEl) {
                calendarEl.setAttribute('translate', 'no');
            }

            if (typeof moment().iYear !== 'function') {
                console.error("moment-hijri plugin is not loaded correctly.");
                return;
            }

            var hijriMonthsInArabic = {
                0: "مُحَرَّم", 1: "صَفَر", 2: "رَبِيع ٱلأَوَّل", 3: "رَبِيع ٱلثَّانِي",
                4: "جُمَادَىٰ ٱلأُولَىٰ", 5: "جُمَادَىٰ ٱلثَّانِيَة", 6: "رَجَب", 7: "شَعْبَان",
                8: "رَمَضَان", 9: "شَوَّال", 10: "ذُو ٱلْقَعْدَة", 11: "ذُو ٱلْحِجَّة"
            };

            function convertToArabicNumbers(number) {
                const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
                return number.toString().replace(/\d/g, digit => arabicDigits[digit]);
            }

            function getHijriMonthRange(startDate, endDate) {
                let startHijriMonth = moment(startDate).iMonth();
                let endHijriMonth = moment(endDate).iMonth();
                let startHijriMonthArabic = hijriMonthsInArabic[startHijriMonth];
                let endHijriMonthArabic = hijriMonthsInArabic[endHijriMonth];

                return startHijriMonthArabic === endHijriMonthArabic
                    ? startHijriMonthArabic
                    : `${startHijriMonthArabic} - ${endHijriMonthArabic}`;
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'en',
                height: 695,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                events: [],
                datesSet: function (info) {
                    let gregorianMonth = moment(info.view.currentStart).locale('ar').format('MMMM');
                    let hijriMonthRange = getHijriMonthRange(info.view.currentStart, info.view.currentEnd);

                    let titleElement = document.querySelector('.fc-toolbar-title');
                    if (titleElement) {
                        titleElement.innerText = `${gregorianMonth} / ${hijriMonthRange}`;
                        titleElement.setAttribute('translate', 'no'); // Prevent translation on title
                    }
                },
                dayCellContent: function (arg) {
                    var gregorianDate = moment(arg.date).format('D');
                    var hijriDate = convertToArabicNumbers(moment(arg.date).subtract(1, 'day').iDate());

                    return {
                        html: `<div translate="no">${gregorianDate}<br><span style="font-family: 'Noto Naskh Arabic', sans-serif;">${hijriDate}</span></div>`
                    };
                }
            });

            calendar.render();
        });


    </script>




</body>

</html>
