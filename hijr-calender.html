    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let currentPage = new URL(window.location.href).pathname.replace(/\/$/, "").split("/").pop() || "index.html";

            let menuLinks = document.querySelectorAll(".nav-menu-link a");

            menuLinks.forEach(link => {
                let linkHref = new URL(link.href, window.location.origin).pathname.replace(/\/$/, "").split("/").pop();

                if (currentPage === linkHref || (currentPage === "index.html" && linkHref === "./")) {
                    link.parentElement.classList.add("nav-active");
                }
            });
        });
    </script>
    <script>

        function convertToArabicNumbers(number) {
            const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return number.toString().replace(/\d/g, d => arabicDigits[d]);
        }

        /* ==============================
           ISLAMIC EVENTS
        ============================== */
        function getIslamicEventForDate(date) {

            let hijriMoment = moment(date).subtract(1, 'day'); // your logic
            let hDay = hijriMoment.iDate();
            let hMonth = hijriMoment.iMonth();

            let events = [];

            if (hMonth === 2 && hDay === 12) events.push({ title: "Eid Milad un Nabi ﷺ", color: "#2e7d32" });
            if (hMonth === 7 && hDay === 15) events.push({ title: "Shab e Barat", color: "#6a1b9a" });
            if (hMonth === 9 && hDay === 1) events.push({ title: "Eid ul Fitr", color: "#d84315" });
            if (hMonth === 11 && hDay === 10) events.push({ title: "Eid ul Adha", color: "#ad1457" });

            if (hDay === 21) events.push({ title: "21vi Sharif", color: "#a99752" });
            if (hDay === 11) events.push({ title: "11vi Sharif", color: "#00897b" });
            if (hDay === 6) events.push({ title: "6ti Sharif", color: "#FF9800" });

            if (hMonth === 0 && hDay === 10) events.push({ title: "Ashura", color: "#1565c0" });
            if (hMonth === 8 && hDay === 21) events.push({ title: "Shadat Maula Ali", color: "#1565c0" });
            if (hMonth === 3 && hDay === 11) events.push({ title: "Eid E Gausia", color: "#1565c0" });
            if (hMonth === 6 && hDay === 6) events.push({ title: "Eid E Chishtiya", color: "#1565c0" });

            return events;
        }

        /* ==============================
           INDIAN BANK HOLIDAYS
        ============================== */
        function getIndianHolidayForDate(date) {

            let d = moment(date).format("MM-DD");

            const holidays = {
                "01-26": { title: "Republic Day", color: "#444" },
                "08-15": { title: "Independence Day", color: "#444" },
                "10-02": { title: "Gandhi Jayanti", color: "#444" },
                "12-25": { title: "Christmas", color: "#444" }
            };

            return holidays[d] ? [holidays[d]] : [];
        }

        document.addEventListener('DOMContentLoaded', function () {

            var calendarEl = document.getElementById('calendar');

            var hijriMonthsInArabic = {
                0: "مُحَرَّم", 1: "صَفَر", 2: "رَبِيع ٱلأَوَّل", 3: "رَبِيع ٱلثَّانِي",
                4: "جُمَادَىٰ ٱلأُولَىٰ", 5: "جُمَادَىٰ ٱلثَّانِيَة", 6: "رَجَب", 7: "شَعْبَان",
                8: "رَمَضَان", 9: "شَوَّال", 10: "ذُو ٱلْقَعْدَة", 11: "ذُو ٱلْحِجَّة"
            };

            function getHijriMonthRange(startDate, endDate) {
                let start = moment(startDate).subtract(1, 'day');
                let end = moment(endDate).subtract(1, 'day');

                let monthRange = hijriMonthsInArabic[start.iMonth()];
                let year = convertToArabicNumbers(start.iYear());

                return `${monthRange} ${year}`;
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',
                height: 695,

                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth'
                },

                /* ==============================
                   EVENTS GENERATOR
                ============================== */
                events: function (fetchInfo, successCallback) {

                    let events = [];
                    let start = moment(fetchInfo.start);
                    let end = moment(fetchInfo.end);

                    while (start.isBefore(end)) {

                        let dateObj = start.toDate();
                        let dateStr = start.format("YYYY-MM-DD");

                        let islamicEvents = getIslamicEventForDate(dateObj);
                        let bankEvents = getIndianHolidayForDate(dateObj);

                        [...islamicEvents, ...bankEvents].forEach(ev => {
                            events.push({
                                title: ev.title,
                                start: dateStr,
                                allDay: true,
                                backgroundColor: ev.color,
                                textColor: "#fff"
                            });
                        });

                        start.add(1, 'day');
                    }

                    successCallback(events);
                },

                /* ==============================
                   HEADER TITLE
                ============================== */
                datesSet: function (info) {

                    let gregorianMonth = moment(info.view.currentStart).format('MMMM YYYY');
                    let hijriRange = getHijriMonthRange(info.view.currentStart, info.view.currentEnd);

                    document.querySelector('.fc-toolbar-title').innerText =
                        `${gregorianMonth} / ${hijriRange}`;
                },

                /* ==============================
                   DATE CELL DESIGN
                ============================== */
                dayCellContent: function (arg) {

                    let engDate = moment(arg.date).format('D');
                    let hijriDate = convertToArabicNumbers(
                        moment(arg.date).subtract(1, 'day').iDate()
                    );

                    return {
                        html: `
                    <div style="text-align:center;">
                        <div style="font-weight:600;font-size:14px;">
                            ${engDate}
                        </div>
                        <div style="font-size:12px;font-family:'Noto Naskh Arabic';">
                            ${hijriDate}
                        </div>
                    </div>
                `
                    };
                }

            });

            calendar.render();
        });

    </script>

    <script>
        function autoNightMode() {

            const now = new Date();
            const hour = now.getHours();

            // Night between 6PM and 6AM
            if (hour >= 18 || hour < 6) {
                document.body.classList.add("night-mode");
            } else {
                document.body.classList.remove("night-mode");
            }
        }

        autoNightMode();
        setInterval(autoNightMode, 60000); // check every 1 minute
    </script>
