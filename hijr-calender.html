<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOOR E IBADAT | HIJRI CALENDAR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.6">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css">
    <style>
        /* Base event style */
        .fc-event {
            border: none !important;
            padding: 2px 4px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
        }

        /* Make text wrap nicely */
        .fc-event-title {
            white-space: normal !important;
        }

        /* Small screens */
        @media (max-width: 768px) {
            .fc-event {
                font-size: 10px;
                padding: 2px;
                border-radius: 4px;
            }
        }

        /* Very small screens */
        @media (max-width: 480px) {
            .fc-event {
                font-size: 9px;
                padding: 1px 2px;
            }
        }
    </style>
</head>

<body>

    <section>
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-11">
                    <div id="calendar" style="height: 700px;"></div>
                </div>
                <div class="col-lg-1 side-menu-col">
                    <div class="side-menu">
                        <div class="nav-menu-link"><a href="index.html"><span>Home</span></a></div>
                        <div class="nav-menu-link"><a href="hijr-calender.html"><span>Hijr</span></a></div>
                        <div class="nav-menu-link"><a href="ramazan.html"><span>Ramzan</span></a></div>
                        <div class="nav-menu-link"><a href="dua.html"><span>Dua's</span></a></div>
                        <div class="nav-menu-link"><a href="contact.html"><span>Contact</span></a></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.15/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>

    <script>



        function getIslamicEventForDate(date) {
            // 🔥 GLOBAL -1 HIJRI DAY ADJUSTMENT
            let hijriMoment = moment(date).subtract(1, 'day');

            let hDay = hijriMoment.iDate();
            let hMonth = hijriMoment.iMonth(); // 0-based
            let events = [];

            if (hMonth === 2 && hDay === 12) events.push({ title: "Eid Milad un Nabi ﷺ", color: "#2e7d32" });
            if (hMonth === 7 && hDay === 15) events.push({ title: "Shab e Barat", color: "#6a1b9a" });
            if (hMonth === 9 && hDay === 1) events.push({ title: "Eid ul Fitr", color: "#d84315" });
            if (hMonth === 11 && hDay === 10) events.push({ title: "Eid ul Adha", color: "#ad1457" });

            // Monthly events
            if (hDay === 21) events.push({ title: "21vi Sharif", color: "#a99752" });
            if (hDay === 11) events.push({ title: "11vi Sharif", color: "#00897b" });
            if (hDay === 6) events.push({ title: "6ti Sharif", color: "#FF9800" });

            // Urs e Ghaus Pak — 11 Rabi us Sani
            if (hMonth === 0 && hDay === 10) events.push({ title: "Ashura Shadat <br>  Imam Hussain <br> And His Campanions", color: "#1565c0" });
            if (hMonth === 8 && hDay === 21) events.push({ title: "Shadat Maula Ali", color: "#1565c0" });
            if (hMonth === 3 && hDay === 11) events.push({ title: "Eid E Gausia", color: "#1565c0" });
            if (hMonth === 6 && hDay === 6) events.push({ title: "Eid E Chishtiya", color: "#1565c0" });


            return events;
        }


        function getIndianHolidayForDate(date) {
            let d = moment(date).format("MM-DD");
            const holidays = {
                "01-26": "Republic Day",
                "08-15": "Independence Day",
                "10-02": "Gandhi Jayanti",
                "12-25": "Christmas"
            };
            return holidays[d] ? [{ title: holidays[d], color: "#444" }] : [];
        }

        document.addEventListener('DOMContentLoaded', function () {

            var calendarEl = document.getElementById('calendar');

            var hijriMonthsInArabic = {
                0: "مُحَرَّم", 1: "صَفَر", 2: "رَبِيع ٱلأَوَّل", 3: "رَبِيع ٱلثَّانِي",
                4: "جُمَادَىٰ ٱلأُولَىٰ", 5: "جُمَادَىٰ ٱلثَّانِيَة", 6: "رَجَب", 7: "شَعْبَان",
                8: "رَمَضَان", 9: "شَوَّال", 10: "ذُو ٱلْقَعْدَة", 11: "ذُو ٱلْحِجَّة"
            };

            function convertToArabicNumbers(number) {
                const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
                return number.toString().replace(/\d/g, d => arabicDigits[d]);
            }

            function getHijriMonthRange(startDate, endDate) {
                let startMonth = moment(startDate).iMonth();
                let endMonth = moment(endDate).iMonth();
                let startYear = moment(startDate).iYear();
                let endYear = moment(endDate).iYear();

                let monthRange = hijriMonthsInArabic[startMonth] === hijriMonthsInArabic[endMonth]
                    ? hijriMonthsInArabic[startMonth]
                    : `${hijriMonthsInArabic[startMonth]} - ${hijriMonthsInArabic[endMonth]}`;

                let yearRange = startYear === endYear ? startYear : `${startYear}-${endYear}`;
                return `${monthRange} ${convertToArabicNumbers(yearRange)}`;
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 695,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },

                eventContent: function (arg) {
                    let title = arg.event.title;
                    let iconHtml = "";

                    if (title.includes("11vi Sharif") || title.includes("6ti Sharif")) {
                        iconHtml = `<img src="./img/gumbad.png" 
                        style="width:14px;height:14px;margin-right:4px;vertical-align:middle;">`;
                    }

                    return {
                        html: `
            <div style="display:flex;align-items:center;gap:4px;">
                ${iconHtml}
                <span>${title}</span>
            </div>
        `
                    };
                },


                events: function (fetchInfo, successCallback) {
                    let events = [];
                    let start = moment(fetchInfo.start);
                    let end = moment(fetchInfo.end);

                    while (start.isBefore(end)) {
                        let dateStr = start.format("YYYY-MM-DD");

                        getIslamicEventForDate(start.toDate()).forEach(ev => {
                            events.push({ title: ev.title, start: dateStr, allDay: true, backgroundColor: ev.color, textColor: "white" });
                        });

                        getIndianHolidayForDate(start.toDate()).forEach(ev => {
                            events.push({ title: ev.title, start: dateStr, allDay: true, backgroundColor: ev.color, textColor: "white" });
                        });

                        start.add(1, 'day');
                    }

                    successCallback(events);
                },

                datesSet: function (info) {
                    let gregorianMonth = moment(info.view.currentStart).format('MMMM YYYY');
                    let hijriRange = getHijriMonthRange(info.view.currentStart, info.view.currentEnd);
                    document.querySelector('.fc-toolbar-title').innerText = `${gregorianMonth} / ${hijriRange}`;
                },

                dayCellContent: function (arg) {
                    var gregorianDate = moment(arg.date).format('D');
                    var hijriDate = convertToArabicNumbers(moment(arg.date).subtract(1, 'day').iDate()); // Adjusted -1 day


                    return {
                        html: `<div>${gregorianDate}<br><span style="font-family:'Noto Naskh Arabic';">${hijriDate}</span></div>`
                    };
                }
            });

            calendar.render();
        });


    </script>

</body>

</html>
